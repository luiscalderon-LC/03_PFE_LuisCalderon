<div class="card">

  <div class="card-header">

    <div class="avatar">
      {{ cliente.nombre.charAt(0) }}{{ cliente.apellido.charAt(0) }}
    </div>

    <span class="id">
      ID: #{{ cliente.id }}
    </span>

  </div>

  <h3>
    {{ cliente.nombre }} {{ cliente.apellido }}
  </h3>

  <div class="datos">

    <p>
      <strong>📧 Correo:</strong>
      {{ cliente.correo }}
    </p>

    <p>
      <strong>📱 Teléfono:</strong>
      {{ cliente.telefono }}
    </p>

    <p>
      <strong>📍 Ciudad:</strong>
      {{ cliente.ciudad }}
    </p>

  </div>

  <div class="acciones">

    <button
      class="btn-editar"
      (click)="editarCliente()">

      ✏️ Editar

    </button>

    <button
      class="btn-eliminar"
      (click)="eliminarCliente()">

      🗑️ Eliminar

    </button>

  </div>

</div>
